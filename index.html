<!--
  ECHO CAVE — SHRINK submission (readable source; min.html is the golfed twin)

  You are in a pitch-black, endless 3D cave. A tap / click / Space fires a
  sonar ping. The wavefront lights the cave as it passes, echoes come back
  delayed by distance and panned by direction, and a hidden beacon hums
  somewhere. Find it by ear. But something else hears your pings too.

  Controls
    tap / click / Space   ping
    arrows / WASD         move and turn
    hold pointer          walk (pointer x steers; mouse locks for free look)

  Badges
    Canvas 2D   : every dot is a fillRect on a 2D context (see "render")
    Web Audio   : oscillator -> gain envelope -> stereo panner -> feedback
                  delay (see blip / initAudio)
    Interactive : keyboard, pointer/touch and pointer-lock mouse look
    3D          : 3D point cloud, yaw rotation, perspective divide (see "render")
-->
<body bgcolor=0 style=margin:0;overflow:hidden;touch-action:none>
<canvas id=c></canvas>
<script>
const g = c.getContext('2d');
const { sin, cos, hypot, round, random } = Math;

// ---- cave -----------------------------------------------------------------
// One density function drives geometry, collision, echo rays and occlusion.
// Solid where F > 0. All three frequencies are multiples of 0.1, so the cave
// repeats every 20*pi units in x and z: the world is a torus you can walk
// around forever. `seed` shifts one wave to give a different cave each time.
let seed = 0;
const PERIOD = 62.832; // 20 * pi
const F = (x, z) => sin(x + seed) + sin(1.3 * z) + sin(.7 * (x + z)) - .9;

// Shortest signed offset on the torus.
const wrap = d => d - PERIOD * round(d / PERIOD);

// ---- state ----------------------------------------------------------------
let P;                     // points [x, y, z, brightness]; 0 = beacon, 1 = stalker
let A = 0, echoBus;        // AudioContext (made on first gesture) and delay input
let u, v, a = 0;           // player x, z and yaw
let X = 0, Z = 0, r = 99;  // ping origin and current wavefront radius
let S = 0, n = 0;          // beacons found, pings used
let beaconT = 0, growlT = 0, droneT = 0, stepT = 0, stepPan = .4; // sound timers
let D = 0, m = 0, held = 0; // pointer down, pointer x in [-.5,.5], frames held
const K = {};              // held keys by keyCode

// Place the beacon by random-walking through open space from the player,
// so it is always reachable (the cave has sealed pockets).
function newBeacon() {
  let x = u, z = v;
  for (let i = 3e3; i--;) {
    const s = x + random() - .5, t = z + random() - .5;
    if (F(s, t) < -.2) x = s, z = t;
  }
  P[0] = [x, 0, z, 0];
}

// Build a fresh cave. Points start fully lit, so every new cave opens with
// a burst that shows it for a moment before fading to black.
function newCave() {
  seed = random() * 9;
  P = [0, 0];
  for (let i = 2e5; i--;) {
    const x = random() * 63, z = random() * 63, w = F(x, z);
    const dot = y => P.push([x, y, z, 1]);
    if (w * w < .02) {
      dot((random() * 8 | 0) / 3 - 1.2);          // wall, snapped to strata lines
    } else if (w < 0) {
      const t = random();
      if (t < .1)                                  // rolling floor / ceiling
        dot((t < .05 ? 1 : -1) * (1 + sin(x * 3) * sin(z * 3) / 4));
      if (t > .997)                                // stalactite: column of 6 dots
        for (let k = 1; k < 7; k++) dot(k / 6 - 1.2);
    }
  }
  // Spawn in the middle of open space, with the beacon at least 6 units away
  // (which also rules out spawning in a tiny sealed pocket).
  do {
    u = random() * 63; v = random() * 63;
    newBeacon();
  } while (F(u, v) > -2 || hypot(P[0][0] - u, P[0][2] - v) < 6);
  P[1] = [u + 31, 0, v + 31, 0]; // stalker starts as far away as the torus allows
}
newCave();

// ---- audio ----------------------------------------------------------------
function initAudio() {
  if (A) return;
  A = new AudioContext;
  // Feedback delay shared by every sound: the cave's echo tail.
  echoBus = A.createDelay();
  echoBus.delayTime.value = .25;
  const fb = A.createGain();
  fb.gain.value = .3;
  echoBus.connect(fb).connect(echoBus);
  fb.connect(A.destination);
}

// One blip: frequency falls an octave, gain decays, panned in stereo.
function blip(freq, delay, vol, pan, type = 'sine', len = .2) {
  const t = A.currentTime + delay;
  const o = A.createOscillator(), q = A.createGain(), s = A.createStereoPanner();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  o.frequency.exponentialRampToValueAtTime(freq / 2, t + len);
  q.gain.setValueAtTime(vol, t);
  q.gain.exponentialRampToValueAtTime(.001, t + len);
  s.pan.value = pan;
  o.connect(q).connect(s).connect(A.destination);
  s.connect(echoBus);
  o.start(t);
  o.stop(t + len);
}

function ping() {
  initAudio();
  X = u; Z = v; r = 0; n++;
  blip(1500, 0, .3, 0);
  // Five rays fanned across the view. Each wall hit returns an echo whose
  // delay and loudness depend on distance and whose pan matches its direction.
  for (let i = -2; i < 3; i++) {
    const b = a + i / 2;
    let d = 0;
    while (d < 14 && F(u + sin(b) * d, v + cos(b) * d) < 0) d += .2;
    if (d < 14) blip(900, d * .08, .5 / (1 + d), sin(i / 2));
  }
}

// ---- input ----------------------------------------------------------------
onkeydown = e => {
  K[e.which] = 1;
  if (e.which == 32 && !e.repeat) ping();
};
onkeyup = e => K[e.which] = 0;
onpointermove = e => {
  if (document.pointerLockElement) a += e.movementX / 400, m = 0; // mouse look
  else m = e.x / innerWidth - .5;                                 // touch steer
};
onpointerdown = e => {
  initAudio();                 // must happen inside the gesture
  D = 1; held = 0;
  onpointermove(e);
  if (e.pointerType == 'mouse') c.requestPointerLock();
};
onpointerup = e => {
  D = 0;
  if (held < 15) ping();       // a short tap pings; a long hold was a walk
};

// ---- frame ----------------------------------------------------------------
setInterval(() => {
  const w = c.width = innerWidth, h = c.height = innerHeight; // also clears

  // Turn and move. Axes are tested separately so the player slides on walls.
  held += D;
  a += ((K[39] | K[68]) - (K[37] | K[65]) + D * m * 2) * .04;
  const I = sin(a), O = cos(a);
  const step = ((K[38] | K[87]) - (K[40] | K[83]) + (held * D > 15)) * .06;
  if (F(u + I * step, v) < -.2) u += I * step;
  if (F(u, v + O * step) < -.2) v += O * step;

  if (A) {
    // footsteps: a thud every 20 moving frames, alternating left / right
    if (step && --stepT < 0) stepT = 20, blip(90, 0, .2, stepPan = -stepPan);
    // ambience: a slow 6 s sub-bass swell every 5 s
    if (--droneT < 0) droneT = 300, blip(80, 0, .1, 0, 'sine', 6);
  }

  r += .25; // wavefront expands

  // The stalker drifts straight towards the last ping, through walls.
  const st = P[1];
  {
    const x = wrap(X - st[0]), z = wrap(Z - st[2]), d = hypot(x, z);
    if (d > .1) st[0] += x / d * .025, st[2] += z / d * .025;
  }

  let bx = 0, bz = 1, sx = 0, sz = 9; // beacon and stalker in camera space

  // render
  P.forEach((p, i) => {
    // camera space: nearest torus copy, relative to the player, rotated by yaw
    let x = wrap(p[0] - u), z = wrap(p[2] - v);
    const depth = x * I + z * O, side = x * O - z * I;
    if (i == 0) bx = side, bz = depth;
    if (i == 1) sx = side, sz = depth;

    // Lit when the wavefront reaches it, if nothing solid lies between the
    // ping origin and the point (8 samples along the line).
    x = wrap(p[0] - X); z = wrap(p[2] - Z);
    const d = hypot(x, z);
    if (d < r && d > r - .3 && r < 16) {
      let k = 9;
      while (--k && F(X + x * k / 9, Z + z * k / 9) < .2);
      if (!k) p[3] = 1;
    }
    const e = p[3] *= .985; // fade

    // perspective projection onto the 2D canvas
    if (depth > .1 && e > .02) {
      g.globalAlpha = e;
      g.fillStyle = i > 1 ? `rgb(${255 - depth * 30},${255 - depth * 12},255)`
                  : i ? 'red' : 'gold';
      const f = h / depth * .8, size = (i > 1 ? 9 : 50) / depth + 1;
      g.fillRect(w / 2 + side * f, h / 2 + p[1] * f, size, size);
    }
  });

  if (A) {
    // Beacon hum once a second: panned by bearing, quieter with distance,
    // an octave lower when it is behind you.
    let d = hypot(bx, bz);
    if (--beaconT < 0) beaconT = 60, blip(bz > 0 ? 440 : 220, 0, .4 / (1 + d), bx / (d + 1));
    if (d < 1) { // found it: jingle, then a brand new cave
      S++;
      blip(600, 0, .3, 0); blip(900, .15, .3, 0); blip(1200, .3, .3, 0);
      newCave();
    }
    // Stalker growl: a sawtooth that repeats faster and louder as it closes in.
    d = hypot(sx, sz);
    if (--growlT < 0) growlT = d * 6 + 9, blip(60, 0, .6 / (1 + d / 3), sx / (d + 1), 'sawtooth');
    if (d < .8) { // caught: score resets, new cave
      S = n = 0;
      blip(300, 0, .5, 0, 'sawtooth', 1);
      newCave();
    }
  }

  g.globalAlpha = 1;
  g.fillStyle = 'gold';
  g.font = '20px a';
  g.fillText(n ? `found:${S},pings:${n}` : 'CLICK=PING,ARROWS=MOVE', 9, 24);
}, 16);
</script>
